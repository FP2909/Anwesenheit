<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anwesenheitsplaner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
      color: #333;
      text-align: center;
    }
    .box {
      max-width: 600px;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }
    h1 { margin-top: 0; }
    #status { margin: 20px 0; }
    a {
      display: inline-block;
      padding: 12px 20px;
      background: #0969da;
      color: white;
      text-decoration: none;
      border-radius: 7px;
    }
    a:hover { background: #0757b5; }
    .error { color: #b42318; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Anwesenheitsplaner</h1>
    <div id="status">Anwendung wird gesucht …</div>
    <div id="link"></div>
  </div>

<script>
(async function () {
  const status = document.getElementById("status");
  const linkBox = document.getElementById("link");

  // GitHub Pages:
  // https://FP2909.github.io/Anwesenheit/
  const owner = "FP2909";
  const repo = "Anwesenheit";

  async function getFiles(path = "") {
    const url =
      "https://api.github.com/repos/" + owner + "/" + repo +
      "/contents/" + path;

    const response = await fetch(url, {
      headers: { "Accept": "application/vnd.github+json" }
    });

    if (!response.ok) throw new Error("GitHub API: " + response.status);
    return await response.json();
  }

  async function findHtml(path = "", depth = 0) {
    if (depth > 3) return null;

    const items = await getFiles(path);

    if (!Array.isArray(items)) return null;

    // Zuerst typische Dateinamen bevorzugen
    const preferred = [
      "Anwesenheit.html",
      "Anwesenheitsplaner.html",
      "anwesenheit.html",
      "anwesenheitsplaner.html",
      "app.html"
    ];

    for (const name of preferred) {
      const found = items.find(
        x => x.type === "file" && x.name === name
      );
      if (found) return found.path;
    }

    // Danach jede andere HTML-Datei suchen
    const htmlFile = items.find(
      x => x.type === "file" &&
           x.name.toLowerCase().endsWith(".html") &&
           x.name.toLowerCase() !== "index.html"
    );
    if (htmlFile) return htmlFile.path;

    // Unterordner durchsuchen
    for (const item of items) {
      if (item.type === "dir") {
        const result = await findHtml(item.path, depth + 1);
        if (result) return result;
      }
    }

    return null;
  }

  try {
    const appPath = await findHtml();

    if (!appPath) {
      status.innerHTML =
        '<span class="error">Keine HTML-Anwendung gefunden.</span><br>' +
        'Bitte prüfe, ob deine eigentliche Anwesenheitsplaner-Datei im Repository liegt.';
      return;
    }

    const base = "/Anwesenheit/";
    const target = base + appPath
      .split("/")
      .map(encodeURIComponent)
      .join("/");

    status.textContent = "Anwesenheitsplaner gefunden.";
    linkBox.innerHTML =
      '<a href="' + target + '">Anwesenheitsplaner öffnen</a>';

    // Nach kurzer Anzeige automatisch öffnen
    setTimeout(() => {
      window.location.href = target;
    }, 800);

  } catch (error) {
    status.innerHTML =
      '<span class="error">Die Anwendung konnte nicht automatisch gefunden werden.</span><br>' +
      'Bitte prüfe die Dateien im GitHub-Repository.';
    console.error(error);
  }
})();
</script>
</body>
</html>
